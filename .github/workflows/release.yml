name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish
    runs-on: windows-2022
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/audio-visualizer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build/Release/audio-visualizer.exe" $stage
          Copy-Item "build/Release/shaders" $stage -Recurse
          Copy-Item "build/Release/visualizations" $stage -Recurse
          $zip = "dist/audio-visualizer-${{ github.ref_name }}-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/audio-visualizer-${{ github.ref_name }}-windows-x64.zip
